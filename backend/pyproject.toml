[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# FastAPI legitimately uses Depends()/Query() in endpoint signatures.
# Keep the project check focused on import and runtime errors.
select = ["E", "F", "I"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
